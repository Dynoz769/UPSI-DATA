<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>UPSI-DATA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📁</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Skrin: belum setup -->
  <section id="skrin-setup" class="skrin tengah" hidden>
    <div class="kotak">
      <h1>📁 UPSI-DATA</h1>
      <p>Website belum disambung ke Supabase.</p>
      <p>Isi <code>SUPABASE_URL</code> dan <code>SUPABASE_ANON_KEY</code> dalam fail <code>public/js/config.js</code>, kemudian muat semula. Rujuk <code>README.md</code> untuk langkah penuh.</p>
    </div>
  </section>

  <!-- Skrin: log masuk -->
  <section id="skrin-login" class="skrin tengah" hidden>
    <form id="borang-login" class="kotak">
      <h1>📁 UPSI-DATA</h1>
      <p class="pudar">Log masuk untuk akses fail kau.</p>
      <label>Emel
        <input type="email" name="emel" autocomplete="username" required>
      </label>
      <label>Kata laluan
        <input type="password" name="katalaluan" autocomplete="current-password" required>
      </label>
      <p id="ralat-login" class="ralat" hidden></p>
      <button type="submit" class="btn utama penuh">Log Masuk</button>
    </form>
  </section>

  <!-- Skrin: utama -->
  <section id="skrin-utama" class="skrin" hidden>
    <header class="atas">
      <div class="jenama">📁 UPSI-DATA</div>
      <div class="pengguna">
        <span id="emel-pengguna" class="pudar"></span>
        <button id="btn-keluar" class="btn">Log Keluar</button>
      </div>
    </header>

    <main class="isi">
      <div class="ruang">
        <div class="ruang-teks"><span id="ruang-guna"></span><span class="pudar" id="ruang-had"></span></div>
        <div class="ruang-bar"><div id="ruang-isi"></div></div>
      </div>

      <nav id="tab-folder" class="tab-baris" aria-label="Folder"></nav>

      <div class="alat">
        <input id="cari" type="search" placeholder="Cari nama fail…">
        <select id="susun" aria-label="Susun">
          <option value="baru">Terbaru</option>
          <option value="nama">Nama A–Z</option>
          <option value="saiz">Saiz terbesar</option>
        </select>
        <button id="btn-upload" class="btn utama">⬆ Upload Fail</button>
        <input id="input-fail" type="file" multiple hidden>
      </div>

      <div id="tajuk-folder" class="tajuk-folder" hidden>
        <h2 id="nama-folder"></h2>
        <button id="btn-nama-folder" class="btn kecil">✏️ Tukar nama</button>
        <button id="btn-padam-folder" class="btn kecil bahaya">🗑️ Padam folder</button>
      </div>

      <div id="senarai" class="senarai"></div>
      <div id="kosong" class="kosong" hidden></div>
    </main>

    <div id="lapisan-seret" class="lapisan-seret" hidden><div>Lepaskan untuk upload</div></div>
  </section>

  <!-- Dialog upload -->
  <dialog id="dialog-upload">
    <form id="borang-upload" method="dialog">
      <div class="dialog-kepala">
        <h2>Upload Fail</h2>
        <button type="button" class="btn ikon" data-tutup aria-label="Tutup">✕</button>
      </div>
      <label>Simpan dalam folder
        <input name="folder" list="senarai-folder" required placeholder="cth: Kerja">
      </label>
      <ul id="senarai-upload" class="fail-senarai"></ul>
      <label class="zon-lepas" id="zon-lepas">
        <input id="input-fail-tambah" type="file" multiple hidden>
        <span>+ Tambah fail lagi</span>
      </label>
      <p id="ralat-upload" class="ralat" hidden></p>
      <div class="dialog-kaki">
        <button type="button" class="btn" data-tutup>Batal</button>
        <button type="submit" id="btn-mula-upload" class="btn utama">Upload</button>
      </div>
    </form>
  </dialog>

  <!-- Dialog teks ringkas: folder baru / tukar nama / pindah -->
  <dialog id="dialog-teks">
    <form id="borang-teks" method="dialog">
      <div class="dialog-kepala">
        <h2 id="teks-tajuk"></h2>
        <button type="button" class="btn ikon" data-tutup aria-label="Tutup">✕</button>
      </div>
      <label><span id="teks-label"></span>
        <input name="nilai" required autocomplete="off">
      </label>
      <p id="ralat-teks" class="ralat" hidden></p>
      <div class="dialog-kaki">
        <button type="button" class="btn" data-tutup>Batal</button>
        <button type="submit" id="btn-teks-ok" class="btn utama">OK</button>
      </div>
    </form>
  </dialog>

  <datalist id="senarai-folder"></datalist>
  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
